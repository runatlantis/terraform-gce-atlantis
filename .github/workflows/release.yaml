name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  statuses: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Do not run release workflow on forks
    if: github.repository_owner == 'runatlantis'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set correct Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Release
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          semantic_version: 26.0.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
